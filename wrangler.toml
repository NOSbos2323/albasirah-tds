# Cloudflare Worker configuration
# يستخدم Workers + Static Assets (النهج الحديث)

name = "albasirah-tds"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Static Assets — يخدم كل ملفات public/ كـ static
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# KV Namespaces — لتسجيل النقرات وتتبع IP (بديل data/clicks.log + data/ips.txt)
[[kv_namespaces]]
binding = "CLICKS"
id = "6cb58e0ad1b44162b0f3a16a99eac2ea"

[[kv_namespaces]]
binding = "KNOWN_IPS"
id = "e9798943802441c2bbfe8c9fe22912e3"

[vars]
ENVIRONMENT = "production"
