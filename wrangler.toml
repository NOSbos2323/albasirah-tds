# Cloudflare Worker configuration
# يستخدم Workers + Static Assets (النهج الحديث)

name = "albasirah-tds"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Static Assets — يخدم كل ملفات public/ كـ static
[assets]
directory = "./public"
binding = "ASSETS"
# run_worker_first = true يجعل Worker يعمل أولاً لكل طلب
# هذا ضروري لأن /api/input و /?io0=X و /server/good.js ليست static files
# لكنها تحتاج لمعالجة بواسطة Worker code
run_worker_first = true

[vars]
ENVIRONMENT = "production"
